name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: a force-push or a quick second commit
# should not leave the previous build occupying a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings=40

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify the server bundle has no dev-only imports
        # `vite` is a devDependency. If it ever creeps back to a top-level
        # import in server.ts, the production image dies on boot with
        # MODULE_NOT_FOUND -- fail here instead of at deploy time.
        run: |
          if grep -qE 'require\(["'"'"']vite["'"'"']\)' dist/server.cjs; then
            echo "::error::dist/server.cjs requires vite, which is a devDependency."
            exit 1
          fi

      - name: Dependency audit (high and above)
        # Non-blocking for now: the remaining advisories are build-time only.
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: landcraft-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Boot the real production image and assert it serves the app and both
        # probes before declaring the build good.
        run: |
          docker run -d --name landcraft-ci -p 8080:8080 \
            -e GEMINI_API_KEY=dummy-key-for-smoke-test landcraft-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"success":true'
          curl -fsS http://localhost:8080/api/ready  | grep -q '"ready":true'
          curl -fsS http://localhost:8080/ | grep -q 'LandCraft'
          echo "Image serves the app, /api/health and /api/ready."
          docker logs landcraft-ci
          docker rm -f landcraft-ci
